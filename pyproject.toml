[project]
name = "mamba_ssm"
description = "Mamba state-space model (Legacy CUDA fork)"
requires-python = ">=3.11"
dynamic = ["version"]
license = { file = "LICENSE" }
dependencies = [
    "torch",
    "ninja",
    "einops",
    "transformers",
    "packaging",
]


[project.optional-dependencies]
causal-conv1d = [
    "causal-conv1d>=1.2.0"
]
dev = [
    "pytest"
]


[build-system]
# torch intentionally excluded: build isolation would install CPU torch from
# PyPI, ignoring the user's CUDA-enabled torch.
# Install torch first, then: pip install . --no-build-isolation
requires = [
    "setuptools>=61.0.0",
    "wheel",
    "packaging",
    "ninja",
]
build-backend = "setuptools.build_meta"