[project]
name = "mamba_ssm"
description = "Mamba state-space model (Legacy CUDA fork)"
authors = [
    { name = "Tri Dao", email = "tri@tridao.me" },
    { name = "Albert Gu", email = "agu@cs.cmu.edu" },
    { name = "Ivan Rodionov" }
]
requires-python = ">= 3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
keywords = ["cuda", "pytorch", "state-space model", "legacy gpu", "kepler", "pascal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows"
]
dependencies = [
    # Core dependencies for Mamba-1
    "torch",
    "ninja",
    "einops",
    "transformers",
    "packaging",
    "setuptools>=61.0.0",
    # Triton, Tilelang, Quack, and TVM removed for legacy CUDA support.
    # Mamba-2 and Mamba-3 will gracefully fail to load and fallback to Mamba-1.
]


[project.optional-dependencies]
causal-conv1d = [
    "causal-conv1d>=1.2.0"
]
dev = [
    "pytest"
]


[build-system]
# torch is intentionally excluded: pip's build isolation would install
# torch-cpu from PyPI, ignoring the user's CUDA-enabled torch.
# Users building from source should install torch first, then:
#   pip install mamba-ssm --no-build-isolation
requires = [
    "setuptools>=61.0.0",
    "torch",
    "wheel",
    "packaging",
    "ninja",
]
build-backend = "setuptools.build_meta"